name: Build Kernel KSUN - Beryllium

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source (GitHub user/repo)'
        default: 'MiCode/Xiaomi_Kernel_OpenSource'
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        default: 'beryllium-p-oss'
      KERNEL_DEFCONFIG:
        description: 'Defconfig'
        default: 'beryllium_defconfig'
      KSU_VERSION:
        description: 'KernelSU Version'
        default: 'v0.9.5'
      CLANG_VERSION:
        description: 'Proton Clang Tag (lihat releases di kdrag0n/proton-clang)'
        default: '20210522'
      USE_CCACHE:
        description: 'Gunakan CCache untuk mempercepat build ulang?'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout repo
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Validasi boot.img ada di scripts/
      # ─────────────────────────────────────────────
      - name: Validate boot.img exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/scripts/boot.img" ]; then
            echo "❌ ERROR: boot.img tidak ditemukan di folder scripts/!"
            echo "   Pastikan boot.img sudah ada di scripts/boot.img di repo kamu."
            exit 1
          fi
          echo "✅ boot.img ditemukan: $(du -sh $GITHUB_WORKSPACE/scripts/boot.img | cut -f1)"

      # ─────────────────────────────────────────────
      # 3. Install dependensi sistem
      # ─────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git make bc bison flex \
            libssl-dev libelf-dev \
            python3 python3-pip \
            zip unzip curl wget \
            build-essential \
            libncurses-dev \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            zstd ccache lz4 \
            device-tree-compiler
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      # ─────────────────────────────────────────────
      # 4. Setup CCache
      # ─────────────────────────────────────────────
      - name: Setup CCache
        if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-beryllium-${{ github.event.inputs.KERNEL_BRANCH }}-${{ github.run_number }}
          restore-keys: |
            ccache-beryllium-${{ github.event.inputs.KERNEL_BRANCH }}-
            ccache-beryllium-

      - name: Configure CCache
        if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 5. Download Proton Clang
      # ─────────────────────────────────────────────
      - name: Download Proton Clang toolchain
        run: |
          mkdir -p $HOME/toolchains/proton-clang
          CLANG_TAG=${{ github.event.inputs.CLANG_VERSION }}
          CLANG_URL="https://github.com/kdrag0n/proton-clang/releases/download/${CLANG_TAG}/proton-clang-${CLANG_TAG}.tar.zst"

          echo "📥 Downloading Proton Clang ${CLANG_TAG}..."
          wget -q --show-progress "${CLANG_URL}" -O /tmp/proton-clang.tar.zst || {
            echo "⚠️  Tag ${CLANG_TAG} tidak tersedia, mencoba master..."
            wget -q --show-progress \
              "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz" \
              -O /tmp/proton-clang.tar.zst
          }

          echo "📦 Extracting..."
          tar -I zstd -xf /tmp/proton-clang.tar.zst \
            -C $HOME/toolchains/proton-clang --strip-components=1 2>/dev/null || \
          tar -xf /tmp/proton-clang.tar.zst \
            -C $HOME/toolchains/proton-clang --strip-components=1

          echo "CLANG_PATH=$HOME/toolchains/proton-clang/bin" >> $GITHUB_ENV
          echo "$HOME/toolchains/proton-clang/bin" >> $GITHUB_PATH
          $HOME/toolchains/proton-clang/bin/clang --version
          echo "✅ Proton Clang siap!"

      # ─────────────────────────────────────────────
      # 6. Clone kernel source
      # ─────────────────────────────────────────────
      - name: Clone kernel source
        run: |
          echo "📥 Cloning ${{ github.event.inputs.KERNEL_SOURCE }} @ ${{ github.event.inputs.KERNEL_BRANCH }}"
          git clone \
            --depth=1 \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} \
            https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git \
            kernel_source

          cd kernel_source
          KERNEL_VERSION=$(head -3 Makefile \
            | grep -E "VERSION|PATCHLEVEL|SUBLEVEL" \
            | awk '{print $3}' | tr '\n' '.' | sed 's/\.$//')
          echo "📋 Kernel version: ${KERNEL_VERSION}"
          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV
          git log --oneline -5

      # ─────────────────────────────────────────────
      # 7. Patch KernelSU
      # ─────────────────────────────────────────────
      - name: Patch KernelSU
        run: |
          cd kernel_source
          KSU_VERSION=${{ github.event.inputs.KSU_VERSION }}
          echo "🔧 Patching KernelSU ${KSU_VERSION}..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "${KSU_VERSION}"
          echo "✅ KernelSU patch selesai!"

      # ─────────────────────────────────────────────
      # 8. Fix gcc-wrapper.py untuk Python3
      # ─────────────────────────────────────────────
      - name: Fix gcc-wrapper.py for Python3
        run: |
          cd kernel_source
          cat > scripts/gcc-wrapper.py << 'PYSCRIPT'
#!/usr/bin/env python3
import sys
import subprocess

def run():
    p = subprocess.Popen(
        sys.argv[1:],
        stderr=subprocess.PIPE,
        stdout=subprocess.PIPE
    )
    stdout, stderr = p.communicate()
    if stdout:
        sys.stdout.buffer.write(stdout)
    if stderr:
        sys.stderr.buffer.write(stderr)
    return p.returncode

sys.exit(run())
PYSCRIPT
          chmod +x scripts/gcc-wrapper.py
          echo "✅ gcc-wrapper.py fixed for Python3"

      # ─────────────────────────────────────────────
      # 9. Build kernel
      # ─────────────────────────────────────────────
      - name: Build kernel
        run: |
          cd kernel_source

          export ARCH=arm64
          export SUBARCH=arm64
          export CC="${CLANG_PATH}/clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="${CLANG_PATH}/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="${CLANG_PATH}/arm-linux-gnueabihf-"
          export AR="${CLANG_PATH}/llvm-ar"
          export NM="${CLANG_PATH}/llvm-nm"
          export OBJCOPY="${CLANG_PATH}/llvm-objcopy"
          export OBJDUMP="${CLANG_PATH}/llvm-objdump"
          export STRIP="${CLANG_PATH}/llvm-strip"
          export LD="${CLANG_PATH}/ld.lld"

          if [ "$USE_CCACHE" = "1" ]; then
            export CC="ccache ${CLANG_PATH}/clang"
            echo "🚀 CCache aktif"
          fi

          # Step 1: defconfig
          echo "⚙️  Generating defconfig..."
          make O=out ARCH=arm64 \
            CC="${CC}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            ${{ github.event.inputs.KERNEL_DEFCONFIG }}

          # Step 2: KernelSU configs
          echo "⚙️  Applying KernelSU configs..."
          scripts/config --file out/.config \
            --enable  CONFIG_KPROBES \
            --enable  CONFIG_HAVE_KPROBES \
            --enable  CONFIG_KPROBE_EVENTS \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable  CONFIG_CC_STACKPROTECTOR_NONE \
            --disable CONFIG_DEBUG_INFO \
            --disable CONFIG_DEBUG_INFO_DWARF4 \
            --enable  CONFIG_OVERLAY_FS \
            --enable  CONFIG_TMPFS_XATTR || true

          # Step 3: olddefconfig
          make O=out ARCH=arm64 \
            CC="${CC}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          # Step 4: Build
          echo "🔨 Building dengan $(nproc) cores..."
          make -j$(nproc) O=out ARCH=arm64 \
            CC="${CC}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            AR="${AR}" NM="${NM}" \
            OBJCOPY="${OBJCOPY}" OBJDUMP="${OBJDUMP}" \
            STRIP="${STRIP}" LD="${LD}" \
            HOSTCC="gcc" HOSTCXX="g++" \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error -w" \
            2>&1 | tee build.log

          # Step 5: Cek hasil
          echo "🔍 Mencari kernel image..."
          if ls out/arch/arm64/boot/Image.gz-dtb 2>/dev/null; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
          elif ls out/arch/arm64/boot/Image-dtb 2>/dev/null; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image-dtb" >> $GITHUB_ENV
          elif ls out/arch/arm64/boot/Image.gz 2>/dev/null; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
          elif ls out/arch/arm64/boot/Image 2>/dev/null; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image" >> $GITHUB_ENV
          else
            echo "❌ Kernel image tidak ditemukan!"
            tail -50 build.log
            exit 1
          fi
          ls -lah out/arch/arm64/boot/Image* 2>/dev/null || true

      # ─────────────────────────────────────────────
      # 10. Repack boot.img (dari scripts/boot.img)
      # ─────────────────────────────────────────────
      - name: Repack boot.img dengan kernel baru
        run: |
          echo "📥 Downloading magiskboot..."
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" \
            -O Magisk.apk
          unzip -p Magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          ./magiskboot --version && echo "✅ magiskboot siap!"

          echo "📦 Unpacking scripts/boot.img..."
          cp "$GITHUB_WORKSPACE/scripts/boot.img" original-boot.img
          ./magiskboot unpack original-boot.img
          ls -lah

          echo "🔄 Mengganti kernel..."
          KERNEL_IMG="kernel_source/${{ env.KERNEL_IMAGE }}"
          if [ ! -f "$KERNEL_IMG" ]; then
            echo "❌ Kernel image tidak ditemukan: $KERNEL_IMG"
            exit 1
          fi
          cp "$KERNEL_IMG" kernel
          echo "✅ Kernel baru: $(du -sh kernel)"

          echo "📦 Repacking..."
          ./magiskboot repack original-boot.img new-boot.img

          if [ -f "new-boot.img" ]; then
            echo "✅ new-boot.img berhasil!"
            ls -lah new-boot.img original-boot.img
          else
            echo "❌ GAGAL membuat new-boot.img!"
            exit 1
          fi

      # ─────────────────────────────────────────────
      # 11. Verifikasi
      # ─────────────────────────────────────────────
      - name: Verify new-boot.img
        run: |
          ORIG_SIZE=$(stat -c%s original-boot.img)
          NEW_SIZE=$(stat -c%s new-boot.img)
          DIFF=$((NEW_SIZE - ORIG_SIZE))
          echo "📊 Original : $(numfmt --to=iec $ORIG_SIZE)"
          echo "📊 New      : $(numfmt --to=iec $NEW_SIZE)"
          echo "📊 Selisih  : +$(numfmt --to=iec $DIFF)"
          echo "✅ Verifikasi selesai!"

      # ─────────────────────────────────────────────
      # 12. Upload artifact
      # ─────────────────────────────────────────────
      - name: Upload new-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSU-${{ github.event.inputs.KSU_VERSION }}-Beryllium-run${{ github.run_number }}
          path: new-boot.img
          retention-days: 14
          if-no-files-found: error

      # ─────────────────────────────────────────────
      # 13. Build summary
      # ─────────────────────────────────────────────
      - name: Generate build summary
        if: always()
        run: |
          echo "## 🏗️ Build Summary - Beryllium KernelSU" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel Source | ${{ github.event.inputs.KERNEL_SOURCE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.event.inputs.KERNEL_BRANCH }} |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU | ${{ github.event.inputs.KSU_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clang | ${{ github.event.inputs.CLANG_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "new-boot.img" ]; then
            echo "### ✅ Build BERHASIL" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build GAGAL" >> $GITHUB_STEP_SUMMARY
          fi

      # ─────────────────────────────────────────────
      # 14. Upload build.log jika gagal
      # ─────────────────────────────────────────────
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-run${{ github.run_number }}
          path: kernel_source/build.log
          retention-days: 7

      # ─────────────────────────────────────────────
      # 15. CCache stats
      # ─────────────────────────────────────────────
      - name: Show CCache stats
        if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
        run: ccache --show-stats || true
