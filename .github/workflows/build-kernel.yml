name: Build Kernel KSUN - Poco F1 (Beryllium)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source (owner/repo)'
        required: true
        default: 'ArrowOS-Devices/android_kernel_xiaomi_beryllium'
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        required: true
        default: 'arrow-10.0'
      KERNEL_DEFCONFIG:
        description: 'Defconfig'
        required: true
        default: 'beryllium_defconfig'
      KSUN_BRANCH:
        description: 'KernelSU Next Branch'
        required: true
        default: 'next'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip curl wget \
            gcc g++ build-essential libncurses-dev \
            cpio lz4 zstd ccache \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-beryllium-${{ github.sha }}
          restore-keys: ccache-beryllium-

      - name: Clone Kernel Source
        run: |
          echo "Cloning: ${{ github.event.inputs.KERNEL_SOURCE }}"
          echo "Branch : ${{ github.event.inputs.KERNEL_BRANCH }}"

          git config --global advice.detachedHead false

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${{ github.event.inputs.KERNEL_BRANCH }}" \
            "https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git" \
            kernel_source

          echo "Clone selesai!"
          ls kernel_source/ | head -20

      - name: Patch KernelSU Next
        run: |
          cd kernel_source
          echo "Patching KernelSU Next..."
          curl -LSs \
            "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${{ github.event.inputs.KSUN_BRANCH }}"
          echo "KernelSU Next patched!"

      - name: Build Kernel
        run: |
          cd kernel_source
          JOBS=$(nproc --all)
          echo "Building with $JOBS jobs... Start: $(date)"

          # Disable CONFIG_CC_STACKPROTECTOR_STRONG yang tidak kompatibel
          # dengan compiler baru, pakai GCC untuk kernel 4.9
          
          # Step 1: defconfig pakai GCC
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ github.event.inputs.KERNEL_DEFCONFIG }}

          # Step 2: Disable stackprotector yang tidak kompatibel
          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable CONFIG_CC_STACKPROTECTOR_NONE || true
          
          # Sync config
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          # Step 3: Compile dengan GCC
          # HOSTCFLAGS=-fcommon fix "multiple definition of yylloc" di GCC 10+
          make -j${JOBS} O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            2>&1 | tee build.log

          echo "End: $(date)"
          ls -lh out/arch/arm64/boot/ 2>/dev/null || true

          if ls out/arch/arm64/boot/Image* 2>/dev/null | head -1 | grep -q Image; then
            echo "Kernel built successfully!"
          else
            echo "Kernel build FAILED!"
            tail -100 build.log
            exit 1
          fi

      - name: Install Magiskboot
        run: |
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" \
            -O Magisk.apk
          unzip -p Magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

      - name: Repack Boot Image
        run: |
          BOOT_IMG=""
          for p in "ksun-kernel/scripts/boot.img" "scripts/boot.img"; do
            if [ -f "$p" ]; then BOOT_IMG="$p"; break; fi
          done

          if [ -z "$BOOT_IMG" ]; then
            echo "boot.img tidak ditemukan!"
            find . -name "boot.img" 2>/dev/null
            exit 1
          fi

          cp "$BOOT_IMG" original-boot.img
          ./magiskboot unpack original-boot.img

          KERNEL_PATH=""
          for f in \
            kernel_source/out/arch/arm64/boot/Image.gz-dtb \
            kernel_source/out/arch/arm64/boot/Image.gz \
            kernel_source/out/arch/arm64/boot/Image; do
            if [ -f "$f" ]; then KERNEL_PATH="$f"; break; fi
          done

          cp "$KERNEL_PATH" kernel
          ./magiskboot repack original-boot.img new-boot.img
          ls -lh new-boot.img
          echo "new-boot.img berhasil dibuat!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSUN-Beryllium-${{ github.run_number }}
          path: new-boot.img
          retention-days: 7

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed-${{ github.run_number }}
          path: kernel_source/build.log
          retention-days: 3
