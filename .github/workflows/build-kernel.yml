name: Build Kernel KSUN - Beryllium

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source (GitHub user/repo)'
        default: 'MiCode/Xiaomi_Kernel_OpenSource'
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        default: 'beryllium-p-oss'
      KERNEL_DEFCONFIG:
        description: 'Defconfig'
        default: 'beryllium_defconfig'
      KSU_VERSION:
        description: 'KernelSU Version'
        default: 'v0.9.5'
      CLANG_VERSION:
        description: 'Proton Clang Tag (lihat releases di kdrag0n/proton-clang)'
        default: '20210522'
      USE_CCACHE:
        description: 'Gunakan CCache untuk mempercepat build ulang?'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout repo (berisi boot.img di root)
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Validasi: pastikan boot.img ada di repo
      # ─────────────────────────────────────────────
      - name: Validate boot.img exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/boot.img" ]; then
            echo "❌ ERROR: boot.img tidak ditemukan di root repository!"
            echo "   Pastikan kamu sudah commit file boot.img ke root repo kamu."
            echo "   Jalankan: git add boot.img && git commit -m 'add boot.img' && git push"
            exit 1
          fi
          echo "✅ boot.img ditemukan: $(du -sh $GITHUB_WORKSPACE/boot.img | cut -f1)"

      # ─────────────────────────────────────────────
      # 3. Install dependensi sistem
      # ─────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git make bc bison flex \
            libssl-dev libelf-dev \
            python3 python3-pip \
            zip unzip curl wget \
            build-essential \
            libncurses-dev \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            zstd \
            ccache \
            lz4 \
            device-tree-compiler

          # Setup Python3 sebagai default
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      # ─────────────────────────────────────────────
      # 4. Setup CCache (opsional, mempercepat rebuild)
      # ─────────────────────────────────────────────
      - name: Setup CCache
        if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-beryllium-${{ github.event.inputs.KERNEL_BRANCH }}-${{ github.run_number }}
          restore-keys: |
            ccache-beryllium-${{ github.event.inputs.KERNEL_BRANCH }}-
            ccache-beryllium-

      - name: Configure CCache
        if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 5. Download Proton Clang (bukan GCC!)
      # ─────────────────────────────────────────────
      - name: Download Proton Clang toolchain
        run: |
          mkdir -p $HOME/toolchains/proton-clang

          CLANG_TAG=${{ github.event.inputs.CLANG_VERSION }}
          CLANG_URL="https://github.com/kdrag0n/proton-clang/releases/download/${CLANG_TAG}/proton-clang-${CLANG_TAG}.tar.zst"

          echo "📥 Downloading Proton Clang ${CLANG_TAG}..."
          wget -q --show-progress "${CLANG_URL}" -O /tmp/proton-clang.tar.zst || {
            echo "⚠️  Tag ${CLANG_TAG} tidak tersedia, mencoba versi alternatif..."
            # Fallback: coba download dari mirror atau versi terbaru
            CLANG_URL="https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
            wget -q --show-progress "${CLANG_URL}" -O /tmp/proton-clang.tar.zst
          }

          echo "📦 Extracting..."
          tar -I zstd -xf /tmp/proton-clang.tar.zst -C $HOME/toolchains/proton-clang --strip-components=1 2>/dev/null || \
          tar -xf /tmp/proton-clang.tar.zst -C $HOME/toolchains/proton-clang --strip-components=1

          # Set PATH
          echo "CLANG_PATH=$HOME/toolchains/proton-clang/bin" >> $GITHUB_ENV
          echo "$HOME/toolchains/proton-clang/bin" >> $GITHUB_PATH

          # Verifikasi
          $HOME/toolchains/proton-clang/bin/clang --version
          echo "✅ Proton Clang siap!"

      # ─────────────────────────────────────────────
      # 6. Clone kernel source
      # ─────────────────────────────────────────────
      - name: Clone kernel source
        run: |
          echo "📥 Cloning ${{ github.event.inputs.KERNEL_SOURCE }} branch ${{ github.event.inputs.KERNEL_BRANCH }}..."
          git clone \
            --depth=1 \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} \
            https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git \
            kernel_source

          cd kernel_source

          # Tampilkan info kernel
          KERNEL_VERSION=$(head -3 Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL" | awk '{print $3}' | tr '\n' '.' | sed 's/\.$//')
          echo "📋 Kernel version dari Makefile: ${KERNEL_VERSION}"
          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV

          # Tampilkan commit terakhir
          echo "📝 Latest commit:"
          git log --oneline -5

      # ─────────────────────────────────────────────
      # 7. Patch KernelSU
      # ─────────────────────────────────────────────
      - name: Patch KernelSU
        run: |
          cd kernel_source

          KSU_VERSION=${{ github.event.inputs.KSU_VERSION }}
          echo "🔧 Patching KernelSU ${KSU_VERSION}..."

          # Patch menggunakan script resmi tiann/KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "${KSU_VERSION}"

          # Verifikasi KSU berhasil di-patch
          if [ -d "KernelSU" ] || grep -r "KernelSU" drivers/ --include="Makefile" -l 2>/dev/null | head -1; then
            echo "✅ KernelSU patch berhasil!"
          else
            echo "⚠️  KernelSU directory tidak ditemukan, cek apakah patch berjalan benar"
          fi

      # ─────────────────────────────────────────────
      # 8. Fix gcc-wrapper.py untuk Python3
      # ─────────────────────────────────────────────
      - name: Fix gcc-wrapper.py for Python3
        run: |
          cd kernel_source
          cat > scripts/gcc-wrapper.py << 'PYSCRIPT'
          #!/usr/bin/env python3
          # Fix: Python2 → Python3 compatibility
          import sys
          import subprocess

          def run():
              p = subprocess.Popen(
                  sys.argv[1:],
                  stderr=subprocess.PIPE,
                  stdout=subprocess.PIPE
              )
              stdout, stderr = p.communicate()
              if stdout:
                  sys.stdout.buffer.write(stdout)
              if stderr:
                  sys.stderr.buffer.write(stderr)
              return p.returncode

          sys.exit(run())
          PYSCRIPT
          chmod +x scripts/gcc-wrapper.py
          echo "✅ gcc-wrapper.py fixed for Python3"

      # ─────────────────────────────────────────────
      # 9. Build kernel
      # ─────────────────────────────────────────────
      - name: Build kernel
        run: |
          cd kernel_source

          # Export variabel compiler
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="${CLANG_PATH}/clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="${CLANG_PATH}/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="${CLANG_PATH}/arm-linux-gnueabihf-"
          export AR="${CLANG_PATH}/llvm-ar"
          export NM="${CLANG_PATH}/llvm-nm"
          export OBJCOPY="${CLANG_PATH}/llvm-objcopy"
          export OBJDUMP="${CLANG_PATH}/llvm-objdump"
          export STRIP="${CLANG_PATH}/llvm-strip"
          export LD="${CLANG_PATH}/ld.lld"

          # CCache wrapper jika aktif
          if [ "$USE_CCACHE" = "1" ]; then
            export CC="ccache ${CLANG_PATH}/clang"
            echo "🚀 CCache aktif"
          fi

          # ── Step 1: Generate defconfig ──
          echo "⚙️  Generating defconfig: ${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          make O=out \
            ARCH=arm64 \
            CC="${CC}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            ${{ github.event.inputs.KERNEL_DEFCONFIG }}

          # ── Step 2: Aktifkan config yang dibutuhkan KernelSU ──
          echo "⚙️  Applying KernelSU required configs..."
          scripts/config --file out/.config \
            --enable  CONFIG_KPROBES \
            --enable  CONFIG_HAVE_KPROBES \
            --enable  CONFIG_KPROBE_EVENTS \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable  CONFIG_CC_STACKPROTECTOR_NONE \
            --disable CONFIG_DEBUG_INFO \
            --disable CONFIG_DEBUG_INFO_DWARF4 \
            --enable  CONFIG_OVERLAY_FS \
            --enable  CONFIG_TMPFS_XATTR || true

          # ── Step 3: Regenerate config ──
          make O=out \
            ARCH=arm64 \
            CC="${CC}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          # ── Step 4: Build ──
          echo "🔨 Building kernel dengan $(nproc) CPU cores..."
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC="${CC}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            AR="${AR}" \
            NM="${NM}" \
            OBJCOPY="${OBJCOPY}" \
            OBJDUMP="${OBJDUMP}" \
            STRIP="${STRIP}" \
            LD="${LD}" \
            HOSTCC="gcc" \
            HOSTCXX="g++" \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error -w" \
            2>&1 | tee build.log

          # ── Step 5: Cek hasil build ──
          echo ""
          echo "🔍 Mencari kernel image..."
          if ls out/arch/arm64/boot/Image.gz-dtb 2>/dev/null; then
            echo "✅ Ditemukan: Image.gz-dtb"
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
          elif ls out/arch/arm64/boot/Image-dtb 2>/dev/null; then
            echo "✅ Ditemukan: Image-dtb"
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image-dtb" >> $GITHUB_ENV
          elif ls out/arch/arm64/boot/Image.gz 2>/dev/null; then
            echo "✅ Ditemukan: Image.gz"
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
          elif ls out/arch/arm64/boot/Image 2>/dev/null; then
            echo "✅ Ditemukan: Image"
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image" >> $GITHUB_ENV
          else
            echo "❌ GAGAL: Kernel image tidak ditemukan!"
            echo "📋 50 baris terakhir build.log:"
            tail -50 build.log
            exit 1
          fi

          # Tampilkan ukuran file
          ls -lah out/arch/arm64/boot/Image* 2>/dev/null || true

      # ─────────────────────────────────────────────
      # 10. Download magiskboot dan repack boot.img
      # ─────────────────────────────────────────────
      - name: Repack boot.img dengan kernel baru
        run: |
          echo "📥 Downloading magiskboot..."

          # Download Magisk APK
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" \
            -O Magisk.apk

          # Extract magiskboot binary (x86_64 untuk runner Ubuntu)
          unzip -p Magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          ./magiskboot --version && echo "✅ magiskboot siap!"

          # ── Unpack boot.img original ──
          echo "📦 Unpacking boot.img original (dari repository)..."
          cp "$GITHUB_WORKSPACE/boot.img" original-boot.img
          ./magiskboot unpack original-boot.img

          echo "📋 Isi setelah unpack:"
          ls -lah

          # ── Ganti kernel ──
          echo "🔄 Mengganti kernel..."
          KERNEL_IMG="kernel_source/${{ env.KERNEL_IMAGE }}"

          if [ ! -f "$KERNEL_IMG" ]; then
            echo "❌ Kernel image tidak ditemukan di: $KERNEL_IMG"
            exit 1
          fi

          # magiskboot meng-expect file bernama 'kernel' setelah unpack
          cp "$KERNEL_IMG" kernel
          echo "✅ Kernel baru: $(du -sh kernel)"

          # ── Repack ──
          echo "📦 Repacking boot.img..."
          ./magiskboot repack original-boot.img new-boot.img

          if [ -f "new-boot.img" ]; then
            echo "✅ new-boot.img berhasil dibuat!"
            echo "📏 Ukuran:"
            ls -lah new-boot.img
            ls -lah original-boot.img
          else
            echo "❌ GAGAL: new-boot.img tidak terbuat!"
            exit 1
          fi

      # ─────────────────────────────────────────────
      # 11. Verifikasi output boot.img
      # ─────────────────────────────────────────────
      - name: Verify new-boot.img
        run: |
          echo "🔍 Verifikasi new-boot.img..."

          # Cek magic header
          MAGIC=$(head -c 8 new-boot.img | cat -v 2>/dev/null || python3 -c "
          with open('new-boot.img', 'rb') as f:
              magic = f.read(8)
          print(magic.decode('ascii', errors='replace'))
          ")
          echo "Magic bytes: $(python3 -c "print(open('new-boot.img','rb').read(8))")"

          # Bandingkan ukuran
          ORIG_SIZE=$(stat -c%s original-boot.img)
          NEW_SIZE=$(stat -c%s new-boot.img)
          DIFF=$((NEW_SIZE - ORIG_SIZE))
          echo "📊 Original: $(numfmt --to=iec $ORIG_SIZE)"
          echo "📊 New:      $(numfmt --to=iec $NEW_SIZE)"
          echo "📊 Selisih:  $(numfmt --to=iec $DIFF) (kernel lebih besar = normal)"

          # Unpack baru untuk verifikasi header
          ./magiskboot unpack new-boot.img -o verify_out 2>/dev/null || \
          ./magiskboot unpack new-boot.img 2>/dev/null || true

          echo "✅ Verifikasi selesai!"

      # ─────────────────────────────────────────────
      # 12. Upload new-boot.img sebagai artifact
      # ─────────────────────────────────────────────
      - name: Upload new-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSU-${{ github.event.inputs.KSU_VERSION }}-Beryllium-run${{ github.run_number }}
          path: new-boot.img
          retention-days: 14
          if-no-files-found: error

      # ─────────────────────────────────────────────
      # 13. Upload build summary
      # ─────────────────────────────────────────────
      - name: Generate build summary
        if: always()
        run: |
          echo "## 🏗️ Build Summary - Beryllium KernelSU" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel Source | ${{ github.event.inputs.KERNEL_SOURCE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.event.inputs.KERNEL_BRANCH }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Defconfig | ${{ github.event.inputs.KERNEL_DEFCONFIG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU Version | ${{ github.event.inputs.KSU_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clang Version | ${{ github.event.inputs.CLANG_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "new-boot.img" ]; then
            echo "### ✅ Build BERHASIL" >> $GITHUB_STEP_SUMMARY
            echo "- new-boot.img: $(du -sh new-boot.img | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build GAGAL" >> $GITHUB_STEP_SUMMARY
          fi

      # ─────────────────────────────────────────────
      # 14. Upload build.log jika gagal
      # ─────────────────────────────────────────────
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-run${{ github.run_number }}
          path: kernel_source/build.log
          retention-days: 7

      # ─────────────────────────────────────────────
      # 15. CCache stats
      # ─────────────────────────────────────────────
      - name: Show CCache stats
        if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
        run: ccache --show-stats || true
