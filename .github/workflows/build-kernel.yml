name: Build Kernel KSUN - Beryllium

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source'
        default: 'ArrowOS-Devices/android_kernel_xiaomi_sdm845'
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        default: 'arrow-10.0'
      KERNEL_DEFCONFIG:
        description: 'Defconfig'
        default: 'beryllium_defconfig'
      KSUN_BRANCH:
        description: 'KernelSU Branch'
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update -y && sudo apt-get install -y \
            gcc-9 g++-9 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git make bc bison flex libssl-dev libelf-dev \
            python3 zip unzip curl wget build-essential ccache
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
          sudo ln -sf /usr/bin/python3 /usr/bin/python

- name: Clone & Patch
        run: |
          git clone --depth=1 --branch ${{ github.event.inputs.KERNEL_BRANCH }} \
            https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git kernel_source

          cd kernel_source

          # Patch KernelSU dengan versi lama yang kompatibel kernel 4.9
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -s v0.9.5

          # Fix gcc-wrapper.py Python 2 → 3
          printf '#!/usr/bin/env python3\nimport sys,subprocess\ndef run():\n    p=subprocess.Popen(sys.argv[1:],stderr=subprocess.PIPE,stdout=subprocess.PIPE)\n    o,e=p.communicate()\n    if o: sys.stdout.buffer.write(o)\n    if e: sys.stderr.buffer.write(e)\n    return p.returncode\nsys.exit(run())\n' > scripts/gcc-wrapper.py

          # Fix syscall_fn_t — tambah typedef di syscall_hook.h
          HOOK_FILE="drivers/kernelsu/hook/syscall_hook.h"
          if [ -f "$HOOK_FILE" ]; then
            sed -i '1s/^/#include <linux\/types.h>\ntypedef asmlinkage long (*syscall_fn_t)(void);\n/' "$HOOK_FILE"
            echo "syscall_fn_t typedef added!"
          fi

      - name: Build
        run: |
          cd kernel_source
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=gcc-9 ${{ github.event.inputs.KERNEL_DEFCONFIG }}

          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable CONFIG_CC_STACKPROTECTOR_NONE \
            --disable CONFIG_DEBUG_INFO \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS || true

          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=gcc-9 olddefconfig

          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc-9 HOSTCXX=g++-9 \
            HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-error -w" \
            2>&1 | tee build.log

          ls out/arch/arm64/boot/Image* && echo "SUCCESS!" || { tail -50 build.log; exit 1; }

      - name: Repack Boot
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O Magisk.apk
          unzip -p Magisk.apk lib/x86_64/libmagiskboot.so > magiskboot && chmod +x magiskboot
          cp scripts/boot.img original-boot.img
          ./magiskboot unpack original-boot.img
          cp $(ls kernel_source/out/arch/arm64/boot/Image* | head -1) kernel
          ./magiskboot repack original-boot.img new-boot.img

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSUN-Beryllium-${{ github.run_number }}
          path: new-boot.img
          retention-days: 7

      - name: Upload Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel_source/build.log
          retention-days: 3
