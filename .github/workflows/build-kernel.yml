name: Build Kernel KSU Legacy - Beryllium

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source (GitHub user/repo)'
        default: 'ArrowOS-Devices/android_kernel_xiaomi_sdm845'
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        default: 'arrow-10.0'
      KERNEL_DEFCONFIG:
        description: 'Defconfig'
        default: 'beryllium_defconfig'
      KSU_VERSION:
        description: 'KernelSU Version (main = legacy untuk non-GKI)'
        default: 'main'  # ← UBAH INI dari v0.9.5 ke main
      CLANG_VERSION:
        description: 'Proton Clang Tag'
        default: '20210522'
      USE_CCACHE:
        description: 'Gunakan CCache?'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate boot.img exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/scripts/boot.img" ]; then
            echo "❌ ERROR: boot.img tidak ditemukan!"
            exit 1
          fi
          echo "✅ boot.img: $(du -sh $GITHUB_WORKSPACE/scripts/boot.img | cut -f1)"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip curl wget \
            build-essential libncurses-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            zstd ccache lz4 device-tree-compiler
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup CCache
        if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ksu-${{ github.run_number }}
          restore-keys: ccache-ksu-

      - name: Configure CCache
        if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Download Proton Clang
        run: |
          mkdir -p $HOME/toolchains/proton-clang
          CLANG_TAG=${{ github.event.inputs.CLANG_VERSION }}
          CLANG_URL="https://github.com/kdrag0n/proton-clang/releases/download/${CLANG_TAG}/proton-clang-${CLANG_TAG}.tar.zst"
          
          wget -q --show-progress "${CLANG_URL}" -O /tmp/proton-clang.tar.zst
          tar -I zstd -xf /tmp/proton-clang.tar.zst -C $HOME/toolchains/proton-clang --strip-components=1
          
          echo "CLANG_PATH=$HOME/toolchains/proton-clang/bin" >> $GITHUB_ENV
          echo "$HOME/toolchains/proton-clang/bin" >> $GITHUB_PATH
          $HOME/toolchains/proton-clang/bin/clang --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch ${{ github.event.inputs.KERNEL_BRANCH }} \
            https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git kernel_source
          cd kernel_source
          git log --oneline -5

      - name: Patch KernelSU Legacy (main branch)
        run: |
          cd kernel_source
          echo "🔧 Patching KernelSU Legacy (main branch untuk non-GKI)..."
          
          # Clone KernelSU ke folder KernelSU/
          git clone --depth=1 --branch main https://github.com/tiann/KernelSU.git KernelSU
          
          # Link driver ke kernel
          if [ -d "drivers/kernelsu" ]; then
            rm -rf drivers/kernelsu
          fi
          ln -sf $(pwd)/KernelSU/kernel drivers/kernelsu
          
          # Tambahkan ke drivers/Makefile
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
            echo "✅ Added kernelsu to drivers/Makefile"
          fi
          
          # Tambahkan ke drivers/Kconfig
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "✅ Added kernelsu to drivers/Kconfig"
          fi
          
          echo "✅ KernelSU Legacy patch completed!"
          ls -la drivers/kernelsu/

      - name: Fix gcc-wrapper.py
        run: |
          cd kernel_source
          cat > scripts/gcc-wrapper.py << 'PYSCRIPT'
          #!/usr/bin/env python3
          import sys, subprocess
          p = subprocess.Popen(sys.argv[1:], stderr=subprocess.PIPE, stdout=subprocess.PIPE)
          stdout, stderr = p.communicate()
          if stdout: sys.stdout.buffer.write(stdout)
          if stderr: sys.stderr.buffer.write(stderr)
          sys.exit(p.returncode)
          PYSCRIPT
          chmod +x scripts/gcc-wrapper.py

      - name: Build kernel
        run: |
          cd kernel_source
          
          export ARCH=arm64 SUBARCH=arm64
          export CC="${CLANG_PATH}/clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="${CLANG_PATH}/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export AR="${CLANG_PATH}/llvm-ar"
          export NM="${CLANG_PATH}/llvm-nm"
          export OBJCOPY="${CLANG_PATH}/llvm-objcopy"
          export STRIP="${CLANG_PATH}/llvm-strip"
          export LD="aarch64-linux-gnu-ld"
          
          [ "$USE_CCACHE" = "1" ] && export CC="ccache ${CC}"
          
          # Generate defconfig
          make O=out ARCH=arm64 CC="${CC}" ${{ github.event.inputs.KERNEL_DEFCONFIG }}
          
          # Enable KernelSU configs
          scripts/config --file out/.config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KSU \
            --set-str CONFIG_KSU_VERSION "\"${{ github.event.inputs.KSU_VERSION }}\"" \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable CONFIG_OVERLAY_FS
          
          make O=out ARCH=arm64 CC="${CC}" olddefconfig
          
          # Build
          make -j$(nproc) O=out ARCH=arm64 CC="${CC}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            AR="${AR}" NM="${NM}" OBJCOPY="${OBJCOPY}" \
            STRIP="${STRIP}" LD="${LD}" \
            2>&1 | tee build.log
          
          # Find kernel image
          if ls out/arch/arm64/boot/Image.gz-dtb 2>/dev/null; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
          elif ls out/arch/arm64/boot/Image-dtb 2>/dev/null; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image-dtb" >> $GITHUB_ENV
          elif ls out/arch/arm64/boot/Image.gz 2>/dev/null; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
          else
            echo "❌ Kernel image not found!"; exit 1
          fi

      - name: Repack boot.img
        run: |
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" -O Magisk.apk
          unzip -p Magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          
          cp "$GITHUB_WORKSPACE/scripts/boot.img" original-boot.img
          ./magiskboot unpack original-boot.img
          cp "kernel_source/${{ env.KERNEL_IMAGE }}" kernel
          ./magiskboot repack original-boot.img new-boot.img
          
          ls -lah new-boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSU-Legacy-Beryllium-run${{ github.run_number }}
          path: new-boot.img
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| KSU Version | Legacy (main) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | ${{ github.event.inputs.KERNEL_SOURCE }} |" >> $GITHUB_STEP_SUMMARY
          [ -f "new-boot.img" ] && echo "### ✅ Build SUCCESS" >> $GITHUB_STEP_SUMMARY || echo "### ❌ Build FAILED" >> $GITHUB_STEP_SUMMARY
