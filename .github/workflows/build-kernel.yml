name: Build Kernel KSUN - Poco F1 (Beryllium) / Dipper

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source (owner/repo)'
        required: true
        default: 'MiCode/Xiaomi_Kernel_OpenSource'
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        required: true
        default: 'dipper-q-oss'
      KERNEL_DEFCONFIG:
        description: 'Defconfig'
        required: true
        default: 'sdm845-perf_defconfig'
      KSUN_BRANCH:
        description: 'KernelSU Next Branch'
        required: true
        default: 'next'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          # Install GCC 9 — paling kompatibel dengan kernel 4.9
          sudo apt-get install -y \
            gcc-9 g++-9 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git make bc bison flex \
            libssl-dev libelf-dev \
            python3 python3-pip \
            zip unzip curl wget \
            build-essential libncurses-dev \
            cpio lz4 zstd ccache

          # Set GCC 9 sebagai default
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
          
          gcc --version
          aarch64-linux-gnu-gcc --version

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-dipper-${{ github.sha }}
          restore-keys: ccache-dipper-

      - name: Clone Kernel Source
        run: |
          echo "Cloning: ${{ github.event.inputs.KERNEL_SOURCE }}"
          echo "Branch : ${{ github.event.inputs.KERNEL_BRANCH }}"

          git config --global advice.detachedHead false

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${{ github.event.inputs.KERNEL_BRANCH }}" \
            "https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git" \
            kernel_source

          echo "Clone selesai!"
          ls kernel_source/ | head -20

      - name: Patch KernelSU Next
        run: |
          cd kernel_source
          echo "Patching KernelSU Next..."
          curl -LSs \
            "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${{ github.event.inputs.KSUN_BRANCH }}"
          echo "KernelSU Next patched!"
	
	- name: Fix gcc-wrapper.py (Python 2 → Python 3)
        run: |
          cd kernel_source
          WRAPPER="scripts/gcc-wrapper.py"
          
          if [ -f "$WRAPPER" ]; then
            echo "Patching $WRAPPER untuk Python 3..."
            
            # Fix: print >> sys.stderr, x  →  print(x, file=sys.stderr)
            sed -i 's/print >> sys\.stderr,\s*/print(/g' "$WRAPPER"
            
            # Tambahkan ", file=sys.stderr)" di akhir baris print yang sudah diubah
            # Lebih aman: replace seluruh file dengan Python 3 version
            python3 - <<'PYEOF'
import re

with open("scripts/gcc-wrapper.py", "r") as f:
    content = f.read()

# Fix print >> sys.stderr, expr  →  print(expr, file=sys.stderr)
content = re.sub(
    r'print\s*>>\s*sys\.stderr,\s*(.+)',
    r'print(\1, file=sys.stderr)',
    content
)

# Fix print >> sys.stdout, expr  →  print(expr)
content = re.sub(
    r'print\s*>>\s*sys\.stdout,\s*(.+)',
    r'print(\1)',
    content
)

# Fix bare print "string"  →  print("string")
content = re.sub(
    r'^(\s*)print\s+"(.+)"',
    r'\1print("\2")',
    content,
    flags=re.MULTILINE
)

with open("scripts/gcc-wrapper.py", "w") as f:
    f.write(content)

print("gcc-wrapper.py patched successfully!")
PYEOF

            echo "Hasil patch:"
            grep -n "print" "$WRAPPER"
          else
            echo "gcc-wrapper.py tidak ditemukan, skip."
          fi

      - name: Build Kernel
        run: |
          cd kernel_source
          JOBS=$(nproc --all)
          echo "Building with $JOBS jobs... Start: $(date)"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCC=gcc-9
          export HOSTCXX=g++-9
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          # Step 1: defconfig
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc-9 \
            ${{ github.event.inputs.KERNEL_DEFCONFIG }}

          # Step 2: Disable config incompatible
          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable CONFIG_CC_STACKPROTECTOR_NONE \
            --disable CONFIG_DEBUG_INFO \
            --disable CONFIG_VDSO || true

          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc-9 olddefconfig

          # Step 3: Build — pakai -j4 dulu biar log tidak kacau
          # stderr dipisah supaya error jelas terlihat
          make -j4 O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc-9 \
            HOSTCXX=g++-9 \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            2> >(tee build_error.log >&2) | tee build_stdout.log || true

          # Gabungkan log
          cat build_stdout.log build_error.log > build.log 2>/dev/null || true

          echo "===== LAST 200 LINES ====="
          tail -200 build.log

          echo "End: $(date)"
          ls -lh out/arch/arm64/boot/ 2>/dev/null || true

          if ls out/arch/arm64/boot/Image* 2>/dev/null | grep -q Image; then
            echo "Kernel built successfully!"
          else
            echo "===== ERROR LINES ====="
            grep -i "error:" build.log | head -50 || true
            exit 1
          fi

      - name: Install Magiskboot
        run: |
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" \
            -O Magisk.apk
          unzip -p Magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

      - name: Repack Boot Image
        run: |
          BOOT_IMG=""
          for p in "ksun-kernel/scripts/boot.img" "scripts/boot.img"; do
            if [ -f "$p" ]; then BOOT_IMG="$p"; break; fi
          done

          if [ -z "$BOOT_IMG" ]; then
            echo "boot.img tidak ditemukan!"
            find . -name "boot.img" 2>/dev/null
            exit 1
          fi

          cp "$BOOT_IMG" original-boot.img
          ./magiskboot unpack original-boot.img

          KERNEL_PATH=""
          for f in \
            kernel_source/out/arch/arm64/boot/Image.gz-dtb \
            kernel_source/out/arch/arm64/boot/Image.gz \
            kernel_source/out/arch/arm64/boot/Image; do
            if [ -f "$f" ]; then KERNEL_PATH="$f"; break; fi
          done

          if [ -z "$KERNEL_PATH" ]; then
            echo "Kernel image tidak ditemukan!"
            exit 1
          fi

          cp "$KERNEL_PATH" kernel
          ./magiskboot repack original-boot.img new-boot.img
          ls -lh new-boot.img
          echo "new-boot.img berhasil dibuat!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSUN-Dipper-${{ github.run_number }}
          path: new-boot.img
          retention-days: 7

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed-${{ github.run_number }}
          path: kernel_source/build.log
          retention-days: 3
